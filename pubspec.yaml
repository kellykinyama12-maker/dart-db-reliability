name: dart_db_reliability
description: >
  Enterprise-grade reliability and parity test harness for dart_db_server.
  Differential testing against SQLite as a correctness oracle, plus dedicated
  suites for ACID transactions, constraint enforcement, isolation/concurrency,
  durability/recovery, type semantics, enterprise SQL features, and scale.
  Standalone project (not published) that depends on dart_db_server by path.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  dart_db_server:
    path: ../dart-db-server

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  # SQLite reference engine used as a differential correctness oracle. Needs
  # the native sqlite3 shared library at test time; suites skip themselves if
  # it is unavailable (mirrors dart_db_server's own regression harness).
  sqlite3: ^2.4.0
